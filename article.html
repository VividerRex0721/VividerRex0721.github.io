<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="文章阅读">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7">
  <title>阅读 · 个人博客</title>
</head>
<body>
  <div class="read-progress" id="readProgress"></div>
  <div class="bg-orbs" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="navbar"></header>

  <main class="reader">
    <div class="container reader-layout">
      <!-- 正文 -->
      <div class="reader-main">
        <article class="reader-card glass">
          <div id="articleBody">
            <div class="empty-tip" style="padding:80px 0;"><span class="big">📖</span>正在加载文章…</div>
          </div>
        </article>
        <nav class="article-nav" id="articleNav"></nav>

        <!-- 评论区 -->
        <section class="comments glass" id="commentsSection">
          <div class="comments-head">
            <h3 class="comments-title">💬 评论</h3>
            <span class="comments-count" id="commentCount">0 条</span>
          </div>
          <div class="comments-list" id="commentsList">
            <p class="comments-empty">还没有评论，来说两句吧～</p>
          </div>
          <form class="comment-form" id="commentForm">
            <div class="comment-form-fields">
              <input type="text" id="cName" placeholder="你的昵称 *" maxlength="20" autocomplete="nickname">
              <label class="comment-anon-opt" title="勾选后不显示昵称">
                <input type="checkbox" id="cAnon"> 匿名发表
              </label>
            </div>
            <textarea id="cContent" placeholder="写下你的想法…（纯文本，最多 500 字）" maxlength="500" rows="3"></textarea>
            <div class="comment-actions">
              <span class="comment-tip" id="commentTip"></span>
              <button class="btn btn-primary" type="submit">发表评论</button>
            </div>
          </form>
        </section>
      </div>
      <!-- 目录 -->
      <aside class="toc glass" id="tocBox" style="display:none;">
        <p class="toc-title">✦ 目录</p>
        <ul class="toc-list" id="tocList"></ul>
      </aside>
    </div>
  </main>

  <footer class="footer"></footer>

  <button class="to-top" aria-label="回到顶部">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
  </button>

  <script defer src="config.js?v=7"></script>
  <script defer src="articles/index.bundle.js?v=7"></script>
  <script defer src="js/markdown.js?v=7"></script>
  <script defer src="js/main.js?v=7"></script>
  <script defer src="js/article.js?v=7"></script>
</body>
</html>
