<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="全部文章">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
  <title>文章 · 个人博客</title>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <header class="navbar"></header>

  <main>
    <section class="list-hero">
      <div class="container">
        <span class="section-kicker reveal">✦ ARCHIVE</span>
        <h1 class="list-title grad-text reveal">全部文章</h1>
        <p class="list-sub reveal" id="listSub"></p>
        <div class="list-tools reveal">
          <label class="search-box">
            <svg class="icon search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="text" id="searchInput" placeholder="搜索标题、内容、标签…">
          </label>
          <div class="tag-filters" id="tagFilters"></div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:10px;">
      <div class="container">
        <div class="posts-grid" id="postsGrid"></div>
        <div class="empty-tip" id="emptyTip" style="display:none;">
          <span class="big">🔍</span>没有找到匹配的文章
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"></footer>

  <button class="to-top" aria-label="回到顶部">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
  </button>

  <script defer src="config.js?v=8"></script>
  <script defer src="articles/index.bundle.js?v=8"></script>
  <script defer src="js/markdown.js?v=8"></script>
  <script defer src="js/main.js?v=8"></script>
  <script defer src="js/articles.js?v=8"></script>
</body>
</html>
